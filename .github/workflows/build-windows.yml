name: Build Ritual Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Get Ritual sources
        uses: actions/checkout@v4

      - name: Configure (JUCE downloaded on GitHub runner)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compile Windows VST3
        run: cmake --build build --config Release --target Ritual_VST3 --parallel 2

      - name: Collect compiled plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter Ritual.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "Ritual.vst3 folder not found. Check build log." }
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item -Path $plugin.FullName -Destination output -Recurse -Force
          Write-Host "Packaged $($plugin.FullName)"

      - name: Downloadable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ritual-Windows-VST3
          path: output/Ritual.vst3/
          if-no-files-found: error
